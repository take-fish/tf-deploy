# FishMatrix 测试环境编排（独立测试 MySQL + 共享 Redis/Nacos）
#
# MySQL 使用独立实例：docker-compose.middleware.yml 中的 mysql-test（fm-test-mysql）。
# 测试应用通过 fishmatrix-mw 网络访问：
#   - MySQL：fm_test_* 库，每服务独立运行时账号（只授 DML）
#   - Redis：共享实例 DB1（生产用 DB0）
#   - Nacos：共享实例 namespace fm-test（生产用 fm-prod）
# 业务容器不执行 DDL/seed；schema 由 db-migrate-* 一次性任务用迁移账号执行。
#
# 用法（在 tf-deploy 目录）：
#   bash scripts/ensure-test-secrets.sh
#   docker compose -f docker-compose.middleware.yml up -d mysql-test redis nacos
#   bash scripts/init-test-db.sh
#   bash scripts/build-test-local.sh user chat reader game
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml ps -a
name: fishmatrix-test

# 测试应用连接独立测试 MySQL + 共享 Redis/Nacos
x-test-middleware: &test-middleware
  MYSQL_HOST: "${TEST_MYSQL_HOST:-mysql-test}"
  MYSQL_PORT: "${TEST_MYSQL_PORT:-3306}"
  REDIS_HOST: "${TEST_REDIS_HOST:-redis}"
  REDIS_PORT: "6379"
  REDIS_DATABASE: "1"
  NACOS_ADDR: "${TEST_NACOS_ADDR:-nacos:8848}"
  NACOS_NAMESPACE: fm-test
  # 测试应用读写账号：fm-test namespace 配置读 + 服务注册
  NACOS_USERNAME: "${TEST_FM_APP_NACOS_USERNAME:-fm-app-rw-test}"
  NACOS_PASSWORD: "${TEST_FM_APP_NACOS_PASSWORD:-}"

x-test-service-env: &test-service-env
  TZ: Asia/Shanghai
  # 激活 Nacos Config：tf-<service>.yaml（group FM，namespace fm-test）
  SPRING_PROFILES_ACTIVE: nacos
  # 业务容器不建表、不写 seed；Flyway 由独立迁移 Job 执行
  SQL_INIT_MODE: never
  SPRING_FLYWAY_ENABLED: "false"
  APP_ENV: test
  APP_VERSION: ${TEST_APP_VERSION:-test}
  GIT_COMMIT: ${TEST_GIT_COMMIT:-unknown}
  # 网关签发的身份头共用同一 HMAC 密钥；测试与生产必须使用不同密钥
  FM_IDENTITY_SECRET: ${TEST_FM_IDENTITY_SECRET:-}
  # 直连调试回退校验 Bearer 时使用测试唯一容器名，避免命中生产用户服务
  TF_USER_URL: ${TEST_USER_URL:-http://fm-test-user:8101}
  # 书籍/音频原文落测试专用卷
  FM_STORAGE_ENABLED: "true"
  FM_STORAGE_BASE_DIR: ${TEST_FM_STORAGE_BASE_DIR:-/app/data/files}
  <<: *test-middleware

# 应用服务等待测试 MySQL 可达 + Nacos 配置发布完成
x-test-dependencies: &test-dependencies
  middleware-ready:
    condition: service_completed_successfully
  nacos-init:
    condition: service_completed_successfully

services:
  # 一次性探针：等待共享中间件端口可达，避免应用在中间件启动期间反复失败
  middleware-ready:
    image: redis:7-alpine
    container_name: fm-test-middleware-ready
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for target in mysql-test:3306 redis:6379 nacos:8848; do
          host=$${target%:*}
          port=$${target#*:}
          until nc -z "$$host" "$$port"; do
            echo "waiting for $$target"
            sleep 2
          done
        done
        echo "test mysql and shared middleware ready"
    networks:
      - default
      - mw

  # 一次性任务：在共享 Nacos 的 fm-test namespace 发布测试配置
  nacos-init:
    image: nacos/nacos-server:v2.5.1
    container_name: fm-test-nacos-init
    restart: "no"
    environment:
      NACOS_HOST: nacos:8848
      NACOS_CONTEXT: /nacos
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: "${NACOS_ADMIN_PASSWORD:-}"
      NACOS_AUTH_ENABLE: "${NACOS_AUTH_ENABLE:-false}"
      TZ: Asia/Shanghai
    volumes:
      - ./scripts/init-test-nacos.sh:/init/init-test-nacos.sh:ro
      - ./deploy/nacos/test:/configs:ro
    entrypoint: ["/bin/sh", "/init/init-test-nacos.sh"]
    networks:
      - default
      - mw
    depends_on:
      middleware-ready:
        condition: service_completed_successfully

  # 一次性 Flyway 迁移任务：使用迁移账号，在业务容器启动前完成建表/迁移。
  db-migrate-user:
    image: ghcr.io/take-fish/tf-user:${TF_TEST_USER_TAG:-test}
    container_name: fm-test-db-migrate-user
    restart: "no"
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: "${TEST_MYSQL_HOST:-mysql-test}"
      MYSQL_PORT: "${TEST_MYSQL_PORT:-3306}"
      MYSQL_DB: fm_test_user
      MYSQL_MIGRATE_USER: "${TEST_FM_USER_DB_MIGRATE_USER:-fm_test_user_migrate}"
      MYSQL_MIGRATE_PASSWORD: "${TEST_FM_USER_DB_MIGRATE_PASSWORD:-}"
      FLYWAY_LOCATIONS: classpath:db/migration
    entrypoint: ["java"]
    command:
      - "-Dloader.main=com.fishmatrix.user.migration.DatabaseMigrator"
      - "-cp"
      - "/app/app.jar"
      - "org.springframework.boot.loader.launch.PropertiesLauncher"
    depends_on:
      middleware-ready:
        condition: service_completed_successfully
    networks:
      - default
      - mw

  db-migrate-chat:
    image: ghcr.io/take-fish/tf-chat:${TF_TEST_CHAT_TAG:-test}
    container_name: fm-test-db-migrate-chat
    restart: "no"
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: "${TEST_MYSQL_HOST:-mysql-test}"
      MYSQL_PORT: "${TEST_MYSQL_PORT:-3306}"
      MYSQL_DB: fm_test_chat
      MYSQL_MIGRATE_USER: "${TEST_FM_CHAT_DB_MIGRATE_USER:-fm_test_chat_migrate}"
      MYSQL_MIGRATE_PASSWORD: "${TEST_FM_CHAT_DB_MIGRATE_PASSWORD:-}"
      FLYWAY_LOCATIONS: classpath:db/migration
    entrypoint: ["java"]
    command:
      - "-Dloader.main=com.fishmatrix.chat.migration.DatabaseMigrator"
      - "-cp"
      - "/app/app.jar"
      - "org.springframework.boot.loader.launch.PropertiesLauncher"
    depends_on:
      middleware-ready:
        condition: service_completed_successfully
    networks:
      - default
      - mw

  db-migrate-reader:
    image: ghcr.io/take-fish/tf-reader:${TF_TEST_READER_TAG:-test}
    container_name: fm-test-db-migrate-reader
    restart: "no"
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: "${TEST_MYSQL_HOST:-mysql-test}"
      MYSQL_PORT: "${TEST_MYSQL_PORT:-3306}"
      MYSQL_DB: fm_test_reader
      MYSQL_MIGRATE_USER: "${TEST_FM_READER_DB_MIGRATE_USER:-fm_test_reader_migrate}"
      MYSQL_MIGRATE_PASSWORD: "${TEST_FM_READER_DB_MIGRATE_PASSWORD:-}"
      # 演示书籍只在测试环境由测试 seed 写入，生产迁移目录不含 seed
      FLYWAY_LOCATIONS: "classpath:db/migration,classpath:db/testdata"
    entrypoint: ["java"]
    command:
      - "-Dloader.main=com.fishmatrix.reader.migration.DatabaseMigrator"
      - "-cp"
      - "/app/app.jar"
      - "org.springframework.boot.loader.launch.PropertiesLauncher"
    depends_on:
      middleware-ready:
        condition: service_completed_successfully
    networks:
      - default
      - mw

  db-migrate-game:
    image: ghcr.io/take-fish/tf-game:${TF_TEST_GAME_TAG:-test}
    container_name: fm-test-db-migrate-game
    restart: "no"
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: "${TEST_MYSQL_HOST:-mysql-test}"
      MYSQL_PORT: "${TEST_MYSQL_PORT:-3306}"
      MYSQL_DB: fm_test_game
      MYSQL_MIGRATE_USER: "${TEST_FM_GAME_DB_MIGRATE_USER:-fm_test_game_migrate}"
      MYSQL_MIGRATE_PASSWORD: "${TEST_FM_GAME_DB_MIGRATE_PASSWORD:-}"
      FLYWAY_LOCATIONS: classpath:db/migration
    entrypoint: ["java"]
    command:
      - "-Dloader.main=com.fishmatrix.game.migration.DatabaseMigrator"
      - "-cp"
      - "/app/app.jar"
      - "org.springframework.boot.loader.launch.PropertiesLauncher"
    depends_on:
      middleware-ready:
        condition: service_completed_successfully
    networks:
      - default
      - mw

  db-migrate-music:
    image: ghcr.io/take-fish/tf-music:${TF_TEST_MUSIC_TAG:-test}
    container_name: fm-test-db-migrate-music
    restart: "no"
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: "${TEST_MYSQL_HOST:-mysql-test}"
      MYSQL_PORT: "${TEST_MYSQL_PORT:-3306}"
      MYSQL_DB: fm_test_music
      MYSQL_MIGRATE_USER: "${TEST_FM_MUSIC_DB_MIGRATE_USER:-fm_test_music_migrate}"
      MYSQL_MIGRATE_PASSWORD: "${TEST_FM_MUSIC_DB_MIGRATE_PASSWORD:-}"
      FLYWAY_LOCATIONS: classpath:db/migration
    entrypoint: ["java"]
    command:
      - "-Dloader.main=com.fishmatrix.music.migration.DatabaseMigrator"
      - "-cp"
      - "/app/app.jar"
      - "org.springframework.boot.loader.launch.PropertiesLauncher"
    depends_on:
      middleware-ready:
        condition: service_completed_successfully
    networks:
      - default
      - mw

  gateway:
    image: ghcr.io/take-fish/tf-gateway:${TF_TEST_GATEWAY_TAG:-test}
    container_name: fm-test-gateway
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      PORT: "8080"
      # 测试栈必须显式标记环境，否则网关默认写入 production，日志检索按 env 过滤会串环境。
      APP_ENV: test
      # 与测试业务服务保持同一 HMAC 密钥，网关注入的身份头才会被接受
      FM_IDENTITY_SECRET: ${TEST_FM_IDENTITY_SECRET:-}
      NACOS_ADDR: ${TEST_NACOS_ADDR:-nacos:8848}
      NACOS_NAMESPACE: fm-test
      GATEWAY_NACOS_USERNAME: ${TEST_GATEWAY_NACOS_USERNAME:-fm-gateway-ro-test}
      GATEWAY_NACOS_PASSWORD: ${TEST_GATEWAY_NACOS_PASSWORD:-}
      GATEWAY_CONFIG_DATA_ID: tf-gateway.yaml
      GATEWAY_CONFIG_GROUP: FM
      GATEWAY_DISCOVERY_GROUP: DEFAULT_GROUP
      GATEWAY_DISCOVERY_ENABLED: ${GATEWAY_DISCOVERY_ENABLED:-true}
      # 静态地址仅作 Nacos 发现失败时的兜底；必须使用环境唯一容器名，
      # 不能用 compose 服务名（生产/测试共用 mw 网络时会串到另一环境）。
      TF_USER_URL: ${TEST_USER_URL:-http://fm-test-user:8101}
      TF_CHAT_URL: ${TEST_CHAT_URL:-http://fm-test-chat:8102}
      TF_READER_URL: ${TEST_READER_URL:-http://fm-test-reader:8103}
      TF_GAME_URL: ${TEST_GAME_URL:-http://fm-test-game:8104}
      TF_MUSIC_URL: ${TEST_MUSIC_URL:-http://fm-test-music:8105}
    ports:
      - "${TEST_GATEWAY_PORT:-18080}:8080"
    networks:
      - default
      - mw

  web:
    image: ghcr.io/take-fish/tf-web:${TF_TEST_WEB_TAG:-test}
    container_name: fm-test-web
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${TEST_WEB_PORT:-18088}:80"
    depends_on:
      gateway:
        condition: service_started

  user:
    image: ghcr.io/take-fish/tf-user:${TF_TEST_USER_TAG:-test}
    container_name: fm-test-user
    restart: unless-stopped
    environment:
      <<: *test-service-env
      MYSQL_DB: fm_test_user
      MYSQL_APP_USER: "${TEST_FM_USER_DB_USER:-fm_test_user_app}"
      MYSQL_APP_PASSWORD: "${TEST_FM_USER_DB_PASSWORD:-}"
      # 测试管理员与生产密码隔离（TEST_USER_ADMIN_PASSWORD 由脚本生成到 .env）
      USER_ADMIN_USERNAME: ${USER_ADMIN_USERNAME:-admin}
      USER_ADMIN_PASSWORD: ${TEST_USER_ADMIN_PASSWORD:-}
      # 测试环境允许显式创建/同步管理员；生产默认关闭
      USER_ADMIN_SEED_ENABLED: "true"
    volumes:
      - user-test-files:/app/data/files
    depends_on:
      <<: *test-dependencies
      db-migrate-user:
        condition: service_completed_successfully
    ports:
      - "${TEST_USER_PORT:-18101}:8101"
    networks:
      - default
      - mw

  chat:
    image: ghcr.io/take-fish/tf-chat:${TF_TEST_CHAT_TAG:-test}
    container_name: fm-test-chat
    restart: unless-stopped
    environment:
      <<: *test-service-env
      MYSQL_DB: fm_test_chat
      MYSQL_APP_USER: "${TEST_FM_CHAT_DB_USER:-fm_test_chat_app}"
      MYSQL_APP_PASSWORD: "${TEST_FM_CHAT_DB_PASSWORD:-}"
    volumes:
      - chat-test-images:/app/data/chat-images
    depends_on:
      <<: *test-dependencies
      db-migrate-chat:
        condition: service_completed_successfully
    ports:
      - "${TEST_CHAT_PORT:-18102}:8102"
    networks:
      - default
      - mw

  reader:
    image: ghcr.io/take-fish/tf-reader:${TF_TEST_READER_TAG:-test}
    container_name: fm-test-reader
    restart: unless-stopped
    environment:
      <<: *test-service-env
      MYSQL_DB: fm_test_reader
      MYSQL_APP_USER: "${TEST_FM_READER_DB_USER:-fm_test_reader_app}"
      MYSQL_APP_PASSWORD: "${TEST_FM_READER_DB_PASSWORD:-}"
    volumes:
      - reader-test-files:/app/data/files
    depends_on:
      <<: *test-dependencies
      db-migrate-reader:
        condition: service_completed_successfully
    ports:
      - "${TEST_READER_PORT:-18103}:8103"
    networks:
      - default
      - mw

  game:
    image: ghcr.io/take-fish/tf-game:${TF_TEST_GAME_TAG:-test}
    container_name: fm-test-game
    restart: unless-stopped
    environment:
      <<: *test-service-env
      MYSQL_DB: fm_test_game
      MYSQL_APP_USER: "${TEST_FM_GAME_DB_USER:-fm_test_game_app}"
      MYSQL_APP_PASSWORD: "${TEST_FM_GAME_DB_PASSWORD:-}"
    depends_on:
      <<: *test-dependencies
      db-migrate-game:
        condition: service_completed_successfully
    ports:
      - "${TEST_GAME_PORT:-18104}:8104"
    networks:
      - default
      - mw

  music:
    image: ghcr.io/take-fish/tf-music:${TF_TEST_MUSIC_TAG:-test}
    container_name: fm-test-music
    restart: unless-stopped
    environment:
      <<: *test-service-env
      MYSQL_DB: fm_test_music
      MYSQL_APP_USER: "${TEST_FM_MUSIC_DB_USER:-fm_test_music_app}"
      MYSQL_APP_PASSWORD: "${TEST_FM_MUSIC_DB_PASSWORD:-}"
    volumes:
      - music-test-files:/app/data/files
    depends_on:
      <<: *test-dependencies
      db-migrate-music:
        condition: service_completed_successfully
    ports:
      - "${TEST_MUSIC_PORT:-18105}:8105"
    networks:
      - default
      - mw

volumes:
  chat-test-images:
  reader-test-files:
  music-test-files:
  user-test-files:

networks:
  default:
  # 共享中间件网络（由 docker-compose.middleware.yml 创建）
  mw:
    external: true
    name: fishmatrix-mw
