# FishMatrix 业务服务编排（分机层）
#
# 用法：
#   集中机本地验证：docker compose -f docker-compose.services.yml up -d
#   分机部署：复制本文件到分机，设置环境变量后按需拉起个别服务（例：docker compose -f docker-compose.services.yml up -d chat）
#
# 说明：
#   - 与公共层（docker-compose.yml）共用 project name/network，按 compose 服务名互访
#   - 集中机全栈运行：中间件默认使用 compose 服务名 mysql / redis / nacos
#   - 分机部署：用环境变量覆盖为集中机地址，例如：
#       export MYSQL_HOST=10.28.13.214
#       export REDIS_HOST=10.28.13.214
#       export NACOS_ADDR=10.28.13.214:8848
#   - 密码变量：每服务 FM_<SVC>_DB_PASSWORD / FM_APP_NACOS_PASSWORD（见集中机 .env）
#   - 业务容器不建表；schema 由 docker-compose.migrate.yml 的迁移 Job 管理
name: fishmatrix

x-service-env: &service-env
  TZ: Asia/Shanghai
  # 激活后从 Nacos Config 拉取 tf-<service>.yaml（group FM，namespace 见 NACOS_NAMESPACE）
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-nacos}
  MYSQL_HOST: ${MYSQL_HOST:-mysql}
  MYSQL_PORT: "3306"
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: "6379"
  REDIS_DATABASE: "0"
  NACOS_ADDR: ${NACOS_ADDR:-nacos:8848}
  NACOS_NAMESPACE: ${NACOS_NAMESPACE:-fm-prod}
  # 应用读写账号：目标 namespace 配置读 + 服务注册，不再使用管理员
  NACOS_USERNAME: ${FM_APP_NACOS_USERNAME:-fm-app-rw-prod}
  NACOS_PASSWORD: ${FM_APP_NACOS_PASSWORD:-}
  # 注册到 Nacos 的构建信息，便于网关/排查时区分实例版本
  APP_VERSION: ${APP_VERSION:-dev}
  GIT_COMMIT: ${GIT_COMMIT:-unknown}
  SQL_INIT_MODE: ${SQL_INIT_MODE:-never}
  SPRING_FLYWAY_ENABLED: "false"

services:
  user:
    image: ghcr.io/take-fish/tf-user:${TF_USER_TAG:-latest}
    container_name: fm-user
    restart: unless-stopped
    environment:
      <<: *service-env
      MYSQL_DB: fm_user
      MYSQL_APP_USER: ${FM_USER_DB_USER:-fm_user_app}
      MYSQL_APP_PASSWORD: ${FM_USER_DB_PASSWORD:-}
      # 用户中台管理员（密码由 scripts/ensure-user-admin-secrets.sh 生成到 .env）
      USER_ADMIN_USERNAME: ${USER_ADMIN_USERNAME:-admin}
      USER_ADMIN_PASSWORD: ${USER_ADMIN_PASSWORD:-}
      # 生产默认不在每次启动时静默同步管理员密码；首次初始化/轮换时显式开启
      USER_ADMIN_SEED_ENABLED: ${USER_ADMIN_SEED_ENABLED:-false}
    ports:
      - "${USER_PORT:-8101}:8101"
    networks:
      default:
        # 与测试栈共用 fishmatrix-mw 时，compose 服务名 user 会冲突；
        # 生产内部调用统一使用该环境唯一别名。
        aliases:
          - fm-prod-user
      mw:
        aliases:
          - fm-prod-user

  chat:
    image: ghcr.io/take-fish/tf-chat:${TF_CHAT_TAG:-latest}
    container_name: fm-chat
    restart: unless-stopped
    environment:
      <<: *service-env
      MYSQL_DB: fm_chat
      MYSQL_APP_USER: ${FM_CHAT_DB_USER:-fm_chat_app}
      MYSQL_APP_PASSWORD: ${FM_CHAT_DB_PASSWORD:-}
      # 生产/测试共用 mw 网络时不能用服务名 user（会解析到测试用户服务）
      TF_USER_URL: ${TF_USER_URL:-http://fm-prod-user:8101}
    volumes:
      - chat-images:/app/data/chat-images
    ports:
      - "${CHAT_PORT:-8102}:8102"
    networks:
      - default
      - mw

  reader:
    image: ghcr.io/take-fish/tf-reader:${TF_READER_TAG:-latest}
    container_name: fm-reader
    restart: unless-stopped
    environment:
      <<: *service-env
      MYSQL_DB: fm_reader
      MYSQL_APP_USER: ${FM_READER_DB_USER:-fm_reader_app}
      MYSQL_APP_PASSWORD: ${FM_READER_DB_PASSWORD:-}
    ports:
      - "${READER_PORT:-8103}:8103"
    networks:
      - default
      - mw

  game:
    image: ghcr.io/take-fish/tf-game:${TF_GAME_TAG:-latest}
    container_name: fm-game
    restart: unless-stopped
    environment:
      <<: *service-env
      MYSQL_DB: fm_game
      MYSQL_APP_USER: ${FM_GAME_DB_USER:-fm_game_app}
      MYSQL_APP_PASSWORD: ${FM_GAME_DB_PASSWORD:-}
    ports:
      - "${GAME_PORT:-8104}:8104"
    networks:
      - default
      - mw

  music:
    image: ghcr.io/take-fish/tf-music:${TF_MUSIC_TAG:-latest}
    container_name: fm-music
    restart: unless-stopped
    environment:
      <<: *service-env
      MYSQL_DB: fm_music
      MYSQL_APP_USER: ${FM_MUSIC_DB_USER:-fm_music_app}
      MYSQL_APP_PASSWORD: ${FM_MUSIC_DB_PASSWORD:-}
    ports:
      - "${MUSIC_PORT:-8105}:8105"
    networks:
      - default
      - mw

volumes:
  chat-images:

networks:
  # 共享中间件网络（由 docker-compose.middleware.yml 创建）
  mw:
    external: true
    name: fishmatrix-mw
