# FishMatrix 生产配置 · Nacos namespace=fm-prod · dataId=tf-chat.yaml · group=FM
# 由 scripts/init-nacos.sh 发布；修改后可重跑脚本覆盖。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:fm_chat}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_APP_USER:fm_chat_app}
    password: ${MYSQL_APP_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      encoding: UTF-8

app:
  chat:
    relay-enabled: ${CHAT_RELAY_ENABLED:true}
    presence-ttl-ms: ${CHAT_PRESENCE_TTL_MS:60000}
    history-limit: 1000
    dm-history-limit: 500
    offline-limit: 200
    max-content-length: 2000
    max-nickname-length: 32
    # 生产/测试共用 mw 网络，必须用环境唯一地址；分机部署可用 TF_USER_URL 覆盖
    user-service-url: ${TF_USER_URL:http://fm-prod-user:8101}
    ws-ticket-ttl-seconds: ${CHAT_WS_TICKET_TTL_SECONDS:60}
    auth-cache-ttl-seconds: ${CHAT_AUTH_CACHE_TTL_SECONDS:60}
    recall-window-seconds: ${CHAT_RECALL_WINDOW_SECONDS:120}
    rate-limit-per-10s: ${CHAT_RATE_LIMIT_PER_10S:20}
    allowed-origins: ${CHAT_ALLOWED_ORIGINS:*}
