# FishMatrix 生产配置 · Nacos namespace=fm-prod · dataId=tf-reader.yaml · group=FM
# 由 scripts/init-nacos.sh 发布；修改后可重跑脚本覆盖。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:fm_reader}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_APP_USER:fm_reader_app}
    password: ${MYSQL_APP_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

app:
  reader:
    max-import-bytes: ${READER_MAX_IMPORT_BYTES:8388608}

fm:
  # 统一鉴权：网关签名头优先；直连调试可用 Bearer 回退到生产用户服务
  auth:
    enabled: ${FM_AUTH_ENABLED:true}
    user-service-url: ${TF_USER_URL:http://fm-prod-user:8101}
    identity-secret: ${FM_IDENTITY_SECRET:}
    allow-bearer-fallback: ${FM_AUTH_BEARER_FALLBACK:true}
    cache-ttl: ${FM_AUTH_CACHE_TTL:30s}
  # 原文落生产卷；权限只由数据库记录决定
  storage:
    enabled: ${FM_STORAGE_ENABLED:true}
    base-dir: ${FM_STORAGE_BASE_DIR:/app/data/files}
    max-file-bytes: ${FM_STORAGE_MAX_BYTES:8388608}
  # 消息与 RPC 骨架：默认关闭，不连接任何中间件
  messaging:
    enabled: ${FM_MESSAGING_ENABLED:false}
    log-events: ${FM_MESSAGING_LOG_EVENTS:false}
    name-server: ${ROCKETMQ_NAME_SERVER:}
    topic-prefix: ${FM_TOPIC_PREFIX:FM_}
  rpc:
    enabled: ${FM_RPC_ENABLED:false}
    nacos-namespace: ${NACOS_NAMESPACE:fm-prod}
    group: ${FM_RPC_GROUP:FM}
    timeout-ms: ${FM_RPC_TIMEOUT_MS:3000}
