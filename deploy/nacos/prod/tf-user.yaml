# FishMatrix 生产配置 · Nacos namespace=fm-prod · dataId=tf-user.yaml · group=FM
# 由 scripts/init-nacos.sh 发布；修改后可重跑脚本覆盖。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:fm_user}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_APP_USER:fm_user_app}
    password: ${MYSQL_APP_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}

fm:
  # 消息与 RPC 骨架：默认关闭，不连接任何中间件
  # RocketMQ：生产/测试共享 broker，靠 topic 前缀（FM_ / FM_TEST_）
  # 与 producer group 前缀隔离。启用前确认 fm-rocketmq-broker 已就绪。
  messaging:
    enabled: false
    log-events: false
    name-server: rocketmq-nameserver:9876
    topic-prefix: FM_
    producer-group: fm-user
    send-timeout-ms: 3000
    diagnostics-on-startup: false
  rpc:
    enabled: ${FM_RPC_ENABLED:false}
    nacos-namespace: ${NACOS_NAMESPACE:fm-prod}
    group: ${FM_RPC_GROUP:FM}
    timeout-ms: ${FM_RPC_TIMEOUT_MS:3000}
