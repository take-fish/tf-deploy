# FishMatrix 生产配置 · Nacos namespace=fm-prod · dataId=tf-game.yaml · group=FM
# 由 scripts/init-nacos.sh 发布；修改后可重跑脚本覆盖。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:fm_game}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_APP_USER:fm_game_app}
    password: ${MYSQL_APP_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}

app:
  environment: ${APP_ENV:production}
  game:
    scheduling-enabled: ${GAME_SCHEDULING_ENABLED:true}
    allowed-origins: ${GAME_ALLOWED_ORIGINS:*}

fm:
  # 统一鉴权：网关签名头优先；直连调试可用 Bearer 回退到生产用户服务
  auth:
    enabled: ${FM_AUTH_ENABLED:true}
    user-service-url: ${TF_USER_URL:http://fm-prod-user:8101}
    identity-secret: ${FM_IDENTITY_SECRET:}
    allow-bearer-fallback: ${FM_AUTH_BEARER_FALLBACK:true}
    cache-ttl: ${FM_AUTH_CACHE_TTL:30s}
  messaging:
    enabled: ${FM_MESSAGING_ENABLED:false}
    log-events: ${FM_MESSAGING_LOG_EVENTS:false}
    name-server: ${ROCKETMQ_NAME_SERVER:}
    topic-prefix: ${FM_TOPIC_PREFIX:FM_}
  rpc:
    enabled: ${FM_RPC_ENABLED:false}
    nacos-namespace: ${NACOS_NAMESPACE:fm-prod}
    group: ${FM_RPC_GROUP:FM}
    timeout-ms: ${FM_RPC_TIMEOUT_MS:3000}
