# tf-agent 场景与限流配置（dataId=tf-agent.yaml, group=FM, namespace=fm-prod）
#
# 生效方式：tf-agent 启动时拉取一次，之后每 NACOS_REFRESH_SECONDS（默认 60s）轮询，
# 改完保存即热更新，不需要重启容器；拉不到就回落代码里的默认场景与限流，服务照常可用。
# 只覆盖这里写出的字段：某场景没写就整体沿用同名内置场景，避免配一半丢能力。
version: 1

agent:
  # 场景 → 可用工具白名单；新增场景只改这里（接入后无需改代码）
  scenes:
    ops:
      title: 运维排障
      temperature: 0.2
      max-tokens: 800
      tools:
        - search_logs
        - check_health
        - query_view
        - query_pipeline
        - search_kb
        - restart_service
    release:
      title: 发布操作
      temperature: 0.1
      max-tokens: 600
      tools:
        - check_health
        - query_pipeline
        - query_view
        - search_kb
        - trigger_release
        - restart_service
    kb:
      title: 知识问答
      temperature: 0.3
      tools:
        - search_kb

  # 上下文预算（8192 token 是硬顶）
  limits:
    max-input-chars: 6000
    history-limit: 10
    max-tool-rounds: 4
    max-tokens: 800

  # 并发与限流：GPU 最坏情况只够 1 路满上下文
  concurrency:
    max-concurrency: 2
    queue-limit: 4
    rate-limit-per-minute: 10

  # 知识库
  knowledge-base:
    embedding-model: BAAI/bge-base-zh-v1.5
    dim: 768
    chunk-size: 500
    chunk-overlap: 80
    top-k: 8
    max-chunks-in-context: 5

  # 写操作只允许管理台确认
  write-operations:
    require-confirm: true
    confirm-ttl-seconds: 60
