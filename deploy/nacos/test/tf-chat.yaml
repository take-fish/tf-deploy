# FishMatrix 测试配置 · Nacos namespace=fm-test · dataId=tf-chat.yaml · group=FM
# 由 scripts/init-test-nacos.sh 发布；测试栈通过 fishmatrix-mw 网络访问共享中间件（namespace=fm-test）。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql-test}:${MYSQL_PORT:3306}/${MYSQL_DB:fm_test_chat}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_APP_USER:fm_test_chat_app}
    password: ${MYSQL_APP_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:1}
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      encoding: UTF-8

app:
  chat:
    relay-enabled: ${CHAT_RELAY_ENABLED:true}
    presence-ttl-ms: ${CHAT_PRESENCE_TTL_MS:60000}
    history-limit: 1000
    dm-history-limit: 500
    offline-limit: 200
    max-content-length: 2000
    max-nickname-length: 32
    ws-ticket-ttl-seconds: ${CHAT_WS_TICKET_TTL_SECONDS:60}
    auth-cache-ttl-seconds: ${CHAT_AUTH_CACHE_TTL_SECONDS:60}
    recall-window-seconds: ${CHAT_RECALL_WINDOW_SECONDS:120}
    rate-limit-per-10s: ${CHAT_RATE_LIMIT_PER_10S:20}
    allowed-origins: ${CHAT_ALLOWED_ORIGINS:*}

fm:
  # 统一鉴权：网关签名头优先；直连调试可用 Bearer 回退到测试用户服务
  auth:
    enabled: ${FM_AUTH_ENABLED:true}
    user-service-url: ${TF_USER_URL:http://fm-test-user:8101}
    identity-secret: ${FM_IDENTITY_SECRET:}
    allow-bearer-fallback: ${FM_AUTH_BEARER_FALLBACK:true}
    cache-ttl: ${FM_AUTH_CACHE_TTL:30s}
  # RocketMQ：与生产共享 broker，测试统一使用 FM_TEST_ 前缀。
  # 服务升级到 tf-common 1.2.0 后，把 enabled 改为 true 即接入。
  messaging:
    enabled: false
    log-events: false
    name-server: rocketmq-nameserver:9876
    topic-prefix: FM_TEST_
    producer-group: fm-test-chat
    send-timeout-ms: 3000
    diagnostics-on-startup: false
  rpc:
    enabled: ${FM_RPC_ENABLED:false}
    nacos-namespace: ${NACOS_NAMESPACE:fm-test}
    group: ${FM_RPC_GROUP:FM}
    timeout-ms: ${FM_RPC_TIMEOUT_MS:3000}
