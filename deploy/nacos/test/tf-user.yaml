# FishMatrix 测试配置 · Nacos namespace=fm-test · dataId=tf-user.yaml · group=FM
# 由 scripts/init-test-nacos.sh 发布；测试栈通过 fishmatrix-mw 网络访问共享中间件（namespace=fm-test）。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql-test}:${MYSQL_PORT:3306}/${MYSQL_DB:fm_test_user}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_APP_USER:fm_test_user_app}
    password: ${MYSQL_APP_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:1}

fm:
  # 消息与 RPC 骨架：默认关闭，不连接任何中间件
  # RocketMQ：与生产共享 broker，测试统一使用 FM_TEST_ 前缀。
  # 服务升级到 tf-common 1.2.0 后，把 enabled 改为 true 即接入。
  messaging:
    enabled: false
    log-events: false
    name-server: rocketmq-nameserver:9876
    topic-prefix: FM_TEST_
    producer-group: fm-test-user
    send-timeout-ms: 3000
    diagnostics-on-startup: false
  rpc:
    enabled: ${FM_RPC_ENABLED:false}
    nacos-namespace: ${NACOS_NAMESPACE:fm-test}
    group: ${FM_RPC_GROUP:FM}
    timeout-ms: ${FM_RPC_TIMEOUT_MS:3000}
