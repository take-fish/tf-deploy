# FishMatrix 测试配置 · Nacos namespace=fm-test · dataId=tf-game.yaml · group=FM
# 由 scripts/init-nacos.sh 发布；测试栈通过 fishmatrix-test-mw 网络访问共享中间件。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:fm-mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:fm_test_game}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_APP_USER:fm_app}
    password: ${MYSQL_APP_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:fm-redis}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:1}
