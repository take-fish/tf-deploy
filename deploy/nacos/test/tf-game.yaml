# FishMatrix 测试配置 · Nacos namespace=fm-test · dataId=tf-game.yaml · group=FM
# 由 scripts/init-test-nacos.sh 发布；测试栈通过 fishmatrix-mw 网络访问共享中间件（namespace=fm-test）。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql-test}:${MYSQL_PORT:3306}/${MYSQL_DB:fm_test_game}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_APP_USER:fm_test_game_app}
    password: ${MYSQL_APP_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:1}

app:
  environment: ${APP_ENV:test}
  game:
    # 邀请超时、休息、走子与断线判负由应用默认值控制，可用环境变量覆盖
    scheduling-enabled: ${GAME_SCHEDULING_ENABLED:true}
    allowed-origins: ${GAME_ALLOWED_ORIGINS:*}

fm:
  # 统一鉴权：网关签名头优先；直连调试可用 Bearer 回退到测试用户服务
  auth:
    enabled: ${FM_AUTH_ENABLED:true}
    user-service-url: ${TF_USER_URL:http://fm-test-user:8101}
    identity-secret: ${FM_IDENTITY_SECRET:}
    allow-bearer-fallback: ${FM_AUTH_BEARER_FALLBACK:true}
    cache-ttl: ${FM_AUTH_CACHE_TTL:30s}
  # RocketMQ：与生产共享 broker，测试统一使用 FM_TEST_ 前缀。
  # tf-game 是首个接入验证载体：启动时发布一条 SYSTEM_PROBE 诊断事件。
  messaging:
    enabled: true
    log-events: false
    name-server: rocketmq-nameserver:9876
    topic-prefix: FM_TEST_
    producer-group: fm-test-game
    send-timeout-ms: 3000
    diagnostics-on-startup: true
  rpc:
    enabled: ${FM_RPC_ENABLED:false}
    nacos-namespace: ${NACOS_NAMESPACE:fm-test}
    group: ${FM_RPC_GROUP:FM}
    timeout-ms: ${FM_RPC_TIMEOUT_MS:3000}
