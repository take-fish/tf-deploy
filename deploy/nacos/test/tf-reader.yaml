# FishMatrix 测试配置 · Nacos namespace=fm-test · dataId=tf-reader.yaml · group=FM
# 由 scripts/init-test-nacos.sh 发布；测试栈通过 fishmatrix-mw 网络访问共享中间件（namespace=fm-test）。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql-test}:${MYSQL_PORT:3306}/${MYSQL_DB:fm_test_reader}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_APP_USER:fm_test_reader_app}
    password: ${MYSQL_APP_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:1}
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

app:
  reader:
    max-import-bytes: ${READER_MAX_IMPORT_BYTES:8388608}

fm:
  # 统一鉴权：网关签名头优先；直连调试可用 Bearer 回退到测试用户服务
  auth:
    enabled: ${FM_AUTH_ENABLED:true}
    user-service-url: ${TF_USER_URL:http://fm-test-user:8101}
    identity-secret: ${FM_IDENTITY_SECRET:}
    allow-bearer-fallback: ${FM_AUTH_BEARER_FALLBACK:true}
    cache-ttl: ${FM_AUTH_CACHE_TTL:30s}
  # 原文落测试专用卷；权限只由数据库记录决定
  storage:
    enabled: ${FM_STORAGE_ENABLED:true}
    base-dir: ${FM_STORAGE_BASE_DIR:/app/data/files}
    max-file-bytes: ${FM_STORAGE_MAX_BYTES:8388608}
  # 消息与 RPC 骨架：RPC 默认关闭；RocketMQ 仅测试栈启用。
  # 与生产共享 broker，测试统一使用 FM_TEST_ 前缀。
  # 已接入事件：READER_ACCESS_REQUESTED / READER_ACCESS_DECIDED（访问申请旁路事件）。
  messaging:
    enabled: true
    log-events: true
    name-server: rocketmq-nameserver:9876
    topic-prefix: FM_TEST_
    producer-group: fm-test-reader
    send-timeout-ms: 3000
    diagnostics-on-startup: false
  rpc:
    enabled: ${FM_RPC_ENABLED:false}
    nacos-namespace: ${NACOS_NAMESPACE:fm-test}
    group: ${FM_RPC_GROUP:FM}
    timeout-ms: ${FM_RPC_TIMEOUT_MS:3000}
