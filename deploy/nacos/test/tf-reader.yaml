# FishMatrix 测试配置 · Nacos namespace=fm-test · dataId=tf-reader.yaml · group=FM
# 由 scripts/init-test-nacos.sh 发布；测试栈通过 fishmatrix-mw 网络访问共享中间件（namespace=fm-test）。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql-test}:${MYSQL_PORT:3306}/${MYSQL_DB:fm_test_reader}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_APP_USER:fm_test_reader_app}
    password: ${MYSQL_APP_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:1}
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

app:
  reader:
    max-import-bytes: ${READER_MAX_IMPORT_BYTES:8388608}
