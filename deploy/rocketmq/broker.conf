# FishMatrix RocketMQ broker 配置（生产/测试共享实例）
# 生产与测试通过 topic 前缀（FM_ / FM_TEST_）和 producer group 前缀隔离。
# topic 不做自动创建，统一由 scripts/init-rocketmq.sh 预建。
brokerClusterName = fishmatrix
brokerName = fm-broker
brokerId = 0
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
namesrvAddr = rocketmq-nameserver:9876
brokerIP1 = rocketmq-broker
listenPort = 10911
storePathRootDir = /home/rocketmq/store
autoCreateTopicEnable = false
autoCreateSubscriptionGroup = false
fileReservedTime = 72
deleteWhen = 04
diskMaxUsedSpaceRatio = 75
