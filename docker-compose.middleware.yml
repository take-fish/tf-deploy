# FishMatrix 独立中间件编排（生产/测试共用）
#
# 只运行 MySQL / Redis / Elasticsearch / Nacos，不包含任何业务应用。
# 生产与测试应用分别运行自己的容器，但都连接这套中间件地址：
#   - 生产：fm_user / fm_chat ...，Redis DB0，Nacos namespace=fm-prod
#   - 测试：fm_test_user / fm_test_chat ...，Redis DB1，Nacos namespace=fm-test
#
# 用法（在 tf-deploy 目录）：
#   docker compose -f docker-compose.middleware.yml up -d mysql redis nacos
#   docker compose -f docker-compose.middleware.yml ps
#
# Elasticsearch 已定义但当前未启用；需要时再单独 `up -d elasticsearch`。
# 数据卷沿用原生产卷（显式 name），切换时不会丢数据。
name: fishmatrix-middleware

services:
  mysql:
    image: mysql:8.4
    container_name: fm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fishmatrix}
      MYSQL_APP_USER: ${MYSQL_APP_USER:-fm_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:-}
      MYSQL_TEST_APP_USER: ${TEST_MYSQL_APP_USER:-fm_test_app}
      MYSQL_TEST_APP_PASSWORD: ${TEST_MYSQL_APP_PASSWORD:-}
      TZ: Asia/Shanghai
    ports:
      # 宿主 3306 被原生 MySQL 占用，Docker 发布到 13306；
      # 局域网客户端通过 10.28.13.214:3306 -> 13306 的 Windows 端口转发访问。
      - "${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅首次初始化时执行：生产库 + 测试库 + 两套账号
      - ./scripts/mysql-middleware-init.sh:/docker-entrypoint-initdb.d/10-fm-middleware-init.sh:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      default:
        aliases: [mysql, fm-mysql]

  redis:
    image: redis:7-alpine
    container_name: fm-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      default:
        aliases: [redis, fm-redis]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: fm-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: Asia/Shanghai
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      default:
        aliases: [elasticsearch, fm-es]

  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: fm-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      TZ: Asia/Shanghai
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-}
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v1/console/health/liveness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    networks:
      default:
        aliases: [nacos, fm-nacos]

volumes:
  mysql-data:
    name: fishmatrix_mysql-data
  redis-data:
    name: fishmatrix_redis-data
  es-data:
    name: fishmatrix_es-data
  nacos-data:
    name: fishmatrix_nacos-data

networks:
  # 生产/测试应用都接入这张共享中间件网络；应用之间仍使用各自的默认网络
  default:
    name: fishmatrix-mw
