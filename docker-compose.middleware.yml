# FishMatrix 独立中间件编排（生产/测试 MySQL 物理隔离）
#
# 运行 MySQL / Redis / Elasticsearch / Nacos / RocketMQ，以及统一日志组件
# Loki（存储）/ Alloy（采集容器 stdout）/ Grafana（查询界面）。
# 不包含任何业务应用。
# MySQL 使用两个独立实例：
#   - 生产：fm-mysql（mysql），库 fm_*，Redis DB0，Nacos namespace=fm-prod
#   - 测试：fm-test-mysql（mysql-test），库 fm_test_*，Redis DB1，Nacos namespace=fm-test
# Redis / Nacos / RocketMQ 仍为共享实例：
#   - Redis 用 DB、Nacos 用 namespace 隔离；
#   - RocketMQ 用 topic 前缀（生产 FM_ / 测试 FM_TEST_）与 producer group 前缀隔离。
#
# 用法（在 tf-deploy 目录）：
#   docker compose -f docker-compose.middleware.yml up -d mysql mysql-test redis nacos
#   docker compose -f docker-compose.middleware.yml up -d rocketmq-nameserver rocketmq-broker
#   docker compose -f docker-compose.middleware.yml up -d loki alloy grafana
#   docker compose -f docker-compose.middleware.yml ps
#
# RocketMQ 只在 fishmatrix-mw 网络内提供服务，不映射宿主机端口；
# topic 由 scripts/init-rocketmq.sh 预建，管理命令通过 docker exec 执行。
# Loki / Grafana 仅绑定宿主机回环地址，局域网通过流水线中台的“日志检索”访问。
# Elasticsearch 已定义但当前未启用；需要时再单独 `up -d elasticsearch`。
# 数据卷沿用原生产卷（显式 name），切换时不会丢数据；测试实例使用独立数据卷。
name: fishmatrix-middleware

services:
  mysql:
    image: mysql:8.4
    container_name: fm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fishmatrix}
      TZ: Asia/Shanghai
    ports:
      # 宿主 3306 被原生 MySQL 占用，Docker 发布到 13306；
      # 局域网客户端通过 10.28.13.214:3306 -> 13306 的 Windows 端口转发访问。
      - "${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅首次初始化时执行：只创建生产库；账号由 scripts/init-db.sh 创建
      - ./scripts/mysql-middleware-init.sh:/docker-entrypoint-initdb.d/10-fm-middleware-init.sh:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      default:
        aliases: [mysql, fm-mysql]

  mysql-test:
    image: mysql:8.4
    container_name: fm-test-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${TEST_MYSQL_ROOT_PASSWORD:?TEST_MYSQL_ROOT_PASSWORD 未配置}
      TZ: Asia/Shanghai
    ports:
      # 测试实例独立端口，绝不与生产 13306 混用。
      - "${TEST_MYSQL_HOST_PORT:-13307}:3306"
    volumes:
      - test-mysql-data:/var/lib/mysql
      # 仅首次初始化时执行：只创建 fm_test_* 库；账号由 scripts/init-test-db.sh 创建
      - ./scripts/mysql-test-init.sh:/docker-entrypoint-initdb.d/10-fm-test-init.sh:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=80
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          # 与生产实例同机时限制测试实例，避免导入/重建拖垮生产。
          memory: 1g
    networks:
      default:
        aliases: [mysql-test, fm-test-mysql]

  redis:
    image: redis:7-alpine
    container_name: fm-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      default:
        aliases: [redis, fm-redis]

  loki:
    image: grafana/loki:3.5.1
    container_name: fm-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    ports:
      # 只监听回环，供同机 trace.sh / 运维排查；不对局域网暴露日志接口
      - "127.0.0.1:${LOKI_PORT:-13100}:3100"
    volumes:
      - ./deploy/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      default:
        aliases: [loki, fm-loki]

  alloy:
    image: grafana/alloy:v1.8.3
    container_name: fm-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 192m
    networks:
      default:
        aliases: [alloy, fm-alloy]

  grafana:
    image: grafana/grafana:12.1.0
    container_name: fm-grafana
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:13000}
    ports:
      # 默认只允许本机访问；需要远程访问时通过 SSH 隧道，避免直接暴露在局域网
      - "127.0.0.1:${GRAFANA_PORT:-13000}:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      default:
        aliases: [grafana, fm-grafana]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: fm-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: Asia/Shanghai
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      default:
        aliases: [elasticsearch, fm-es]

  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: fm-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      TZ: Asia/Shanghai
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-}
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v1/console/health/liveness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    networks:
      default:
        aliases: [nacos, fm-nacos]

  # 命名卷首次创建时属主是 root，而 broker 以 UID 3000 运行；
  # 先把卷根目录属主改为 rocketmq，避免 /home/rocketmq/store 写入被拒。
  rocketmq-init:
    image: alpine:latest
    container_name: fm-rocketmq-init
    restart: "no"
    command: ["chown", "3000:3000", "/store"]
    volumes:
      - rocketmq-store:/store
    networks:
      - default

  rocketmq-nameserver:
    image: apache/rocketmq:5.3.3
    container_name: fm-rocketmq-nameserver
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 默认 JVM 堆很大，必须显式限制，与生产 MySQL/Redis/Nacos 同机时避免挤占。
      JAVA_OPT_EXT: -Xms256m -Xmx256m -Xmn128m
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9876"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          # 实测稳态 278MiB：堆 256m 加 metaspace/线程栈后逼近 320m，
          # 留出余量避免容器 OOM kill。
          memory: 448m
    networks:
      default:
        aliases: [rocketmq-nameserver, fm-rocketmq-nameserver]

  rocketmq-broker:
    image: apache/rocketmq:5.3.3
    container_name: fm-rocketmq-broker
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: -Xms768m -Xmx768m -Xmn256m
    command: sh mqbroker -c /home/rocketmq/broker.conf
    volumes:
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/10911"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    depends_on:
      rocketmq-nameserver:
        condition: service_healthy
      rocketmq-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          # 实测稳态 842MiB：堆 768m 加堆外后接近 1g，放宽到 1.5g 留出 GC 与连接峰值余量。
          memory: 1536m
    networks:
      default:
        aliases: [rocketmq-broker, fm-rocketmq-broker]

volumes:
  mysql-data:
    name: fishmatrix_mysql-data
  test-mysql-data:
    name: fishmatrix_test-mysql-data
  redis-data:
    name: fishmatrix_redis-data
  es-data:
    name: fishmatrix_es-data
  nacos-data:
    name: fishmatrix_nacos-data
  loki-data:
    name: fishmatrix_loki-data
  alloy-data:
    name: fishmatrix_alloy-data
  grafana-data:
    name: fishmatrix_grafana-data
  rocketmq-store:
    name: fishmatrix_rocketmq-store

networks:
  # 生产/测试应用都接入这张共享中间件网络；应用之间仍使用各自的默认网络
  default:
    name: fishmatrix-mw
