# FishMatrix 集中机编排：网关 + Web + 控制台
# 说明：
#   - 中间件（MySQL / Redis / Elasticsearch / Nacos）已拆分到 docker-compose.middleware.yml，
#     生产与测试共用一套中间件地址，应用侧按库 / Redis DB / Nacos namespace 隔离
#   - 只引用预构建镜像（ghcr.io），不在本机 build —— 保证 `docker compose config` 离线可校验
#   - 所有变量都有默认值，无 .env 文件也能直接启动（生产环境请复制 .env.example 为 .env 并修改）
#   - 业务服务（user/chat/reader/game/music）见 docker-compose.services.yml
#   - 启动顺序：
#       docker compose -f docker-compose.middleware.yml up -d mysql redis nacos
#       docker compose -f docker-compose.yml -f docker-compose.services.yml up -d
name: fishmatrix

services:
  gateway:
    image: ghcr.io/take-fish/tf-gateway:${TF_GATEWAY_TAG:-latest}
    container_name: fm-gateway
    restart: unless-stopped
    environment:
      PORT: "8080"
      TZ: Asia/Shanghai
      TF_CHAT_URL: ${TF_CHAT_URL:-http://chat:8102}
      TF_READER_URL: ${TF_READER_URL:-http://reader:8103}
      TF_GAME_URL: ${TF_GAME_URL:-http://game:8104}
      TF_MUSIC_URL: ${TF_MUSIC_URL:-http://music:8105}
      TF_USER_URL: ${TF_USER_URL:-http://user:8101}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - default
      - mw

  console:
    image: ghcr.io/take-fish/tf-console:${TF_CONSOLE_TAG:-latest}
    container_name: fm-console
    restart: unless-stopped
    environment:
      PORT: "8301"
      TZ: Asia/Shanghai
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "${CONSOLE_PORT:-8301}:8301"
    networks:
      - default
      - mw

  web:
    image: ghcr.io/take-fish/tf-web:${TF_WEB_TAG:-latest}
    container_name: fm-web
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - default
      - mw

networks:
  # 共享中间件网络（由 docker-compose.middleware.yml 创建）
  mw:
    external: true
    name: fishmatrix-mw
