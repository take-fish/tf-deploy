# FishMatrix 生产数据库迁移 Job（一次性）
#
# 使用每服务迁移账号执行 Flyway，业务容器只拿运行时 DML 账号。
# 部署顺序：
#   1. 备份生产 MySQL：bash scripts/backup-mysql.sh prod
#   2. 执行迁移：docker compose -f docker-compose.migrate.yml run --rm migrate-user
#      （chat/reader/game/music 同理）
#   3. 启动/更新业务容器：docker compose -f docker-compose.yml -f docker-compose.services.yml up -d
#
# 迁移文件随服务镜像发布，不使用宿主机挂载，避免与镜像版本脱节。
name: fishmatrix

x-migrate-env: &migrate-env
  TZ: Asia/Shanghai
  MYSQL_HOST: ${MYSQL_HOST:-mysql}
  MYSQL_PORT: "3306"
  FLYWAY_LOCATIONS: classpath:db/migration

services:
  migrate-user:
    image: ghcr.io/take-fish/tf-user:${TF_USER_TAG:-latest}
    container_name: fm-db-migrate-user
    restart: "no"
    environment:
      <<: *migrate-env
      MYSQL_DB: fm_user
      MYSQL_MIGRATE_USER: ${FM_USER_DB_MIGRATE_USER:-fm_user_migrate}
      MYSQL_MIGRATE_PASSWORD: ${FM_USER_DB_MIGRATE_PASSWORD:-}
    entrypoint: ["java"]
    command:
      - "-Dloader.main=com.fishmatrix.user.migration.DatabaseMigrator"
      - "-cp"
      - "/app/app.jar"
      - "org.springframework.boot.loader.launch.PropertiesLauncher"
    networks:
      - mw

  migrate-chat:
    image: ghcr.io/take-fish/tf-chat:${TF_CHAT_TAG:-latest}
    container_name: fm-db-migrate-chat
    restart: "no"
    environment:
      <<: *migrate-env
      MYSQL_DB: fm_chat
      MYSQL_MIGRATE_USER: ${FM_CHAT_DB_MIGRATE_USER:-fm_chat_migrate}
      MYSQL_MIGRATE_PASSWORD: ${FM_CHAT_DB_MIGRATE_PASSWORD:-}
    entrypoint: ["java"]
    command:
      - "-Dloader.main=com.fishmatrix.chat.migration.DatabaseMigrator"
      - "-cp"
      - "/app/app.jar"
      - "org.springframework.boot.loader.launch.PropertiesLauncher"
    networks:
      - mw

  migrate-reader:
    image: ghcr.io/take-fish/tf-reader:${TF_READER_TAG:-latest}
    container_name: fm-db-migrate-reader
    restart: "no"
    environment:
      <<: *migrate-env
      MYSQL_DB: fm_reader
      MYSQL_MIGRATE_USER: ${FM_READER_DB_MIGRATE_USER:-fm_reader_migrate}
      MYSQL_MIGRATE_PASSWORD: ${FM_READER_DB_MIGRATE_PASSWORD:-}
    entrypoint: ["java"]
    command:
      - "-Dloader.main=com.fishmatrix.reader.migration.DatabaseMigrator"
      - "-cp"
      - "/app/app.jar"
      - "org.springframework.boot.loader.launch.PropertiesLauncher"
    networks:
      - mw

  migrate-game:
    image: ghcr.io/take-fish/tf-game:${TF_GAME_TAG:-latest}
    container_name: fm-db-migrate-game
    restart: "no"
    environment:
      <<: *migrate-env
      MYSQL_DB: fm_game
      MYSQL_MIGRATE_USER: ${FM_GAME_DB_MIGRATE_USER:-fm_game_migrate}
      MYSQL_MIGRATE_PASSWORD: ${FM_GAME_DB_MIGRATE_PASSWORD:-}
    entrypoint: ["java"]
    command:
      - "-Dloader.main=com.fishmatrix.game.migration.DatabaseMigrator"
      - "-cp"
      - "/app/app.jar"
      - "org.springframework.boot.loader.launch.PropertiesLauncher"
    networks:
      - mw

  migrate-music:
    image: ghcr.io/take-fish/tf-music:${TF_MUSIC_TAG:-latest}
    container_name: fm-db-migrate-music
    restart: "no"
    environment:
      <<: *migrate-env
      MYSQL_DB: fm_music
      MYSQL_MIGRATE_USER: ${FM_MUSIC_DB_MIGRATE_USER:-fm_music_migrate}
      MYSQL_MIGRATE_PASSWORD: ${FM_MUSIC_DB_MIGRATE_PASSWORD:-}
    entrypoint: ["java"]
    command:
      - "-Dloader.main=com.fishmatrix.music.migration.DatabaseMigrator"
      - "-cp"
      - "/app/app.jar"
      - "org.springframework.boot.loader.launch.PropertiesLauncher"
    networks:
      - mw

networks:
  # 共享中间件网络（由 docker-compose.middleware.yml 创建）
  mw:
    external: true
    name: fishmatrix-mw
